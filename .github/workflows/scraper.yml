name: Automatický scraper smuteční vývěsky

on:
  schedule:
    # Běží každých 6 hodin (v 0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Možnost spustit ručně tlačítkem v GitHub Actions
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalace systémových závislostí (Tesseract OCR Čeština)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ces

      - name: Instalace Python knihoven
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Spuštění scraperu (a nahrání fotek na Cloudinary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python scraper/scraper.py

      - name: Odstranění fotek z GitHub Releases (ponecháno pouze pro APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view parte-images >/dev/null 2>&1; then
            for asset in $(gh release view parte-images --json assets -q '.assets[].name' | grep -E '\.jpg$|\.png$' || true); do
              gh release delete-asset parte-images "$asset" -y || true
            done
          fi

      - name: Příprava složky pro GitHub Pages
        run: |
          # Zkopírovat databázi do web/data/ pro hosting na GitHub Pages (fotky jsou na Cloudinary)
          mkdir -p web/data
          cp data/database.json web/data/database.json || true
          cp data/database.csv web/data/database.csv || true

      - name: Commit a Push změn do repozitáře
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database.json data/database.csv data/database.sqlite web/data/
          if git diff --staged --quiet; then
            echo "Žádné nové změny v datech."
          else
            git commit -m "Automatická aktualizace parte a databáze [skip ci]"
            git push
          fi

      - name: Nastavení GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrání artefaktu pro Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Publikace na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
