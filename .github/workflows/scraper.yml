name: Automatický scraper smuteční vývěsky

on:
  schedule:
    # Běží každých 6 hodin (v 0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Možnost spustit ručně tlačítkem v GitHub Actions
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalace systémových závislostí (Tesseract OCR Čeština)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ces

      - name: Instalace Python knihoven
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Spuštění scraperu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper/scraper.py

      - name: Nahrání fotek parte a obličejů do GitHub Releases (neomezené úložiště)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view parte-images >/dev/null 2>&1 || gh release create parte-images --title "Úložiště fotek parte a obličejů" --notes "Automatické úložiště obrázků parte a výřezů obličejů mimo Git limit."
          if ls data/images/*.jpg >/dev/null 2>&1; then
            gh release upload parte-images data/images/*.jpg --clobber
          fi
          if ls data/images/faces/*.jpg >/dev/null 2>&1; then
            mkdir -p /tmp/release_faces
            for f in data/images/faces/*.jpg; do
              cp "$f" "/tmp/release_faces/face_$(basename "$f")"
            done
            gh release upload parte-images /tmp/release_faces/face_*.jpg --clobber
          fi

      - name: Příprava složky pro GitHub Pages
        run: |
          # Zkopírovat data a obrázky do web/ pro hosting na GitHub Pages
          mkdir -p web/data web/images
          cp data/database.json web/data/database.json || true
          cp data/database.csv web/data/database.csv || true
          cp -r data/images/* web/images/ || true

      - name: Commit a Push změn do repozitáře
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/ web/images/
          if git diff --staged --quiet; then
            echo "Žádné nové změny v datech."
          else
            git commit -m "Automatická aktualizace parte a databáze [skip ci]"
            git push
          fi

      - name: Nastavení GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrání artefaktu pro Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Publikace na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
