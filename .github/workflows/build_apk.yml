name: Sestavení Android aplikace (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Možnost spustit ručně tlačítkem "Run workflow"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Nastavení Android SDK
        uses: android-actions/setup-android@v3

      - name: Oprávnění pro gradlew
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Sestavení APK (Release/Debug)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Uložení APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: SmutecniVyveska-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
