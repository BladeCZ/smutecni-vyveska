name: Sestavení Android aplikace (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Možnost spustit ručně tlačkem "Run workflow"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nastavení Android SDK (bez zastaralého balíčku tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Nastavení Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sestavení APK (Release a Debug) a vygenerování version.json
        working-directory: android
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/SmutecniVyveska.apk 2>/dev/null || cp app/build/outputs/apk/debug/*.apk dist/SmutecniVyveska.apk
          python3 -c '
          import json, os, subprocess
          from datetime import datetime, timezone
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          v_code = 100 + run_num
          v_name = f"2.3.{run_num}"
          apk_path = "dist/SmutecniVyveska.apk"
          apk_size = os.path.getsize(apk_path) if os.path.exists(apk_path) else 0
          try:
              commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          except Exception:
              commit_msg = "Aktualizace aplikace Smuteční vývěska"
          meta = {
              "versionCode": v_code,
              "versionName": v_name,
              "apkUrl": "https://github.com/BladeCZ/smutecni-vyveska/releases/download/parte-images/SmutecniVyveska.apk",
              "apkSize": apk_size,
              "updatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releaseNotes": commit_msg
          }
          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
          print("Vygenerován version.json:", meta)
          '

      - name: Uložení APK jako artefakt v GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SmutecniVyveska-APK
          path: |
            android/dist/SmutecniVyveska.apk
            android/dist/version.json
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Nahrání APK a version.json do GitHub Releases pro přímé stažení a aktualizaci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view parte-images >/dev/null 2>&1; then
            gh release create parte-images --title "Úložiště fotek parte a Android aplikace" --notes "Automaticky aktualizované úložiště fotek a APK."
          fi
          if [ -f "android/dist/SmutecniVyveska.apk" ]; then
            gh release upload parte-images android/dist/SmutecniVyveska.apk android/dist/version.json --clobber
          fi
